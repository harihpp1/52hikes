<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hari's 52 Hikes Challenge</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #0b1d14;
        color: #f4f4f4;
    }
    header {
        padding: 40px 20px;
        text-align: center;
        background: linear-gradient(to right, #14532d, #0f766e);
    }
    h1 { margin: 0; font-size: 2.5rem; }
    p { margin: 5px 0; opacity: 0.9; }
    .container { max-width: 1000px; margin: auto; padding: 20px; }
    .progress-bar {
        background: #1f2937;
        border-radius: 20px;
        overflow: hidden;
        margin: 20px 0;
    }
    .progress {
        height: 20px;
        background: #22c55e;
        width: 0%;
        transition: width 0.5s ease-in-out;
    }
    .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin: 20px 0;
    }
    .card {
        background: #111827;
        padding: 15px;
        border-radius: 12px;
        text-align: center;
    }
    .hike {
        background: #111827;
        margin: 10px 0;
        padding: 15px;
        border-radius: 12px;
    }
    .small { opacity: 0.8; font-size: 0.9rem; }
</style>
</head>

<body>

<header>
    <h1>🥾 Hari's 52 Hikes Challenge</h1>
    <p>May 23, 2026 → May 22, 2027</p>
    <p>One rule: Never repeat the same hike</p>
</header>

<div class="container">

    <h2>📊 Progress</h2>
    <div class="progress-bar">
        <div id="progress" class="progress"></div>
    </div>

    <p id="progressText"></p>
    <p id="weekends"></p>

    <div class="stats">
        <div class="card"><h3 id="miles">0</h3><p>Total Miles</p></div>
        <div class="card"><h3 id="hikes">0</h3><p>Hikes Completed</p></div>
        <div class="card"><h3 id="goal">52</h3><p>Goal</p></div>
        <div class="card"><h3 id="partners">0</h3><p>Partners</p></div>
    </div>

    <h2>🧭 Hike Log</h2>
    <div id="hikeLog"></div>

</div>

<script>
/* =====================================================
   ADD NEW HIKES HERE — just copy a line and edit it.
   date:     "YYYY-MM-DD"
   name:     hike name
   miles:    a number (use the midpoint for ranges, e.g. 7.5 for 7–8)
   partners: people's names, e.g. ["Pawan", "Naresh"]  (leave [] if solo)
   groups:   optional, e.g. ["THE Meetup Group"] (shown in the log, not counted as partners)
   Everything else (count, miles, partners, progress) updates automatically.
   ===================================================== */
const HIKES = [
  { date: "2026-05-23", name: "Stinson Beach → Mt. Tamalpais", miles: 15, partners: ["Pawan", "Racha", "Shishupal"] },
  { date: "2026-05-30", name: "Purisima Creek Redwoods", miles: 7.5, partners: [], groups: ["THE Meetup Group"] },
  { date: "2026-06-07", name: "Falls Creek, Felton", miles: 7.5, partners: ["Naresh", "Dinesh", "Bharat"], groups: ["THE Meetup Group"] },
  { date: "2026-06-14", name: "Waihee Ridge Trail, Maui", miles: 5, partners: ["Pinki", "Leena"] },
  { date: "2026-06-17", name: "Kīlauea Iki Lava Trail", miles: 4, partners: ["Pinki", "Nivi", "Avni", "Leena", "Shirish", "Asmi", "Aani", "Racha", "Lalit", "Priya", "Naresh", "Chitra"] },
  { date: "2026-07-03", name: "Mount Livermore, Angel Island", miles: 6, partners: ["Nivi", "Avni"] },
  { date: "2026-07-04", name: "Big Basin hike, Berry Creek (partial)", miles: 6, partners: ["Pinki"] },
  { date: "2026-07-12", name: "Montara Mountain North Peak Loop", miles: 7.5, partners: ["Dinesh"] },
  { date: "2026-07-18", name: "Lookout trail and Coyote creek Loop Stevens Creek Reservoir", miles: 6.5, partners: [] },
  { date: "2026-07-25", name: "Mount Umunhum", miles: 8.1, partners: ["Dinesh", "Tina"] },
  { date: "2026-08-01", name: "Bear Creek Summit via Madrone Knoll Trail and Alma Trail Umunhum", miles: 7.4, partners: ["Dinesh", "Tina", "Pawan"] },
  { date: "2026-08-08", name: "Black Mountain through PGE", miles: 12.8, partners: ["Dinesh", "Pawan", "Naresh", "Guoyu"] },
  { date: "2026-08-15", name: "Chamise and Upper Rogue valley trail loop", miles: 7, partners: [] },
  { date: "2026-08-22", name: "Four Mile Trail Yosemite", miles: 11, partners: ["Pawan", "Naresh", "Bharat"] },
  { date: "2026-08-30", name: "Skyline Watershed Ridge", miles: 12, partners: [], groups: ["THE Meetup Group"] },
  { date: "2026-09-06", name: "Dick Bishop, Hassler, Dusky-Footed Woodrat, and Polly Geraci Loop", miles: 6, partners: [] },
  { date: "2026-09-12", name: "Hamms Gulch to Spring Ridge loop (Windy Hill)", miles: 7.5, partners: ["Srini"] },
  { date: "2026-09-18", name: "Torrey Pines from Glider Port", miles: 4, partners: ["Pradeep", "Prathibaa"] },
  { date: "2026-09-26", name: "Pacific Ranch trail to Nob Hill loop", miles: 5, partners: [] },
  { date: "2026-10-03", name: "Bear Gulch, Skyline and Alambique loop", miles: 10, partners: ["Srini"] },
  { date: "2026-10-10", name: "Methuselah, North Leaf and Fir loop", miles: 8, partners: ["Srini"] },
  { date: "2026-10-17", name: "Penasquitos Canyon Rim to Rim", miles: 6, partners: ["Prathibaa"] },
  { date: "2026-10-24", name: "Hidden Villa, Rhus Ridge, Black Mountain, Creek Tail Loop", miles: 5.5, partners: [] },
  { date: "2026-10-31", name: "Zinfandel Tail", miles: 4.5, partners: ["Meetup Group"] },
];

/* ---------- Settings ---------- */
const GOAL = 52;
const END = new Date(2027, 4, 22); // May 22, 2027 (month is 0-indexed)

/* ---------- Helpers ---------- */
function parseDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function formatDate(s) {
  return parseDate(s).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
}
function formatMiles(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

/* ---------- Computed stats ---------- */
const hikes = [...HIKES].sort((a, b) => parseDate(a.date) - parseDate(b.date));
const hikesDone = hikes.length;
const totalMiles = hikes.reduce((sum, h) => sum + (Number(h.miles) || 0), 0);

// Unique partners (case-insensitive, whitespace-trimmed)
const partnerSet = new Set();
hikes.forEach(h => (h.partners || []).forEach(p => {
  const name = p.trim().toLowerCase();
  if (name) partnerSet.add(name);
}));

const progressPercent = Math.min(100, (hikesDone / GOAL) * 100);

// Saturdays left (today through end date)
let weekends = 0;
const d = new Date();
d.setHours(0, 0, 0, 0);
while (d <= END) {
  if (d.getDay() === 6) weekends++;
  d.setDate(d.getDate() + 1);
}

/* ---------- Render ---------- */
document.getElementById("progress").style.width = progressPercent + "%";
document.getElementById("progressText").textContent =
  `${hikesDone} / ${GOAL} hikes completed (${progressPercent.toFixed(1)}%)`;
document.getElementById("weekends").textContent =
  `📅 ${weekends} Saturdays left until target date (May 22, 2027)`;

document.getElementById("hikes").textContent = hikesDone;
document.getElementById("goal").textContent = GOAL;
document.getElementById("miles").textContent = formatMiles(totalMiles);
document.getElementById("partners").textContent = partnerSet.size;

const log = document.getElementById("hikeLog");
hikes.forEach((h, i) => {
  const row = document.createElement("div");
  row.className = "hike";
  row.appendChild(document.createTextNode(`${i + 1}. ${h.name}`));

  const details = [formatDate(h.date), `${formatMiles(Number(h.miles) || 0)} miles`]
    .concat((h.partners || []).length || (h.groups || []).length
      ? [[...(h.partners || []), ...(h.groups || [])].join(", ")]
      : []);

  const small = document.createElement("div");
  small.className = "small";
  small.textContent = details.join(" • ");
  row.appendChild(small);
  log.appendChild(row);
});
</script>

</body>
</html>
